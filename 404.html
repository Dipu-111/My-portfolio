<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Dipendra Pandey</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0e16" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e16'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='28' fill='%2357d687'%3EDP%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #0b0e16;
        --text: #e7e9ef;
        --text-dim: #9ca0af;
        --green: #57d687;
        --teal: #4fd1c5;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.16);
        --mono: "JetBrains Mono", monospace;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: "Poppins", sans-serif;
        background: var(--bg);
        color: var(--text-dim);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(600px 400px at 80% 0%, rgba(87, 214, 135, 0.12), transparent 70%),
          radial-gradient(600px 500px at 0% 100%, rgba(106, 168, 255, 0.08), transparent 70%),
          radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px) 0 0 / 26px 26px;
      }
      main {
        display: flex;
        align-items: center;
        gap: 56px;
        max-width: 880px;
      }
      .phone {
        flex: none;
        width: 200px;
        height: 410px;
        border-radius: 32px;
        padding: 9px;
        background: #05070c;
        border: 2px solid #2a3148;
        box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.9), 0 0 80px -20px rgba(87, 214, 135, 0.25);
        transform: perspective(1200px) rotateY(-12deg) rotateX(4deg);
        animation: float 5s ease-in-out infinite;
      }
      .screen {
        position: relative;
        height: 100%;
        border-radius: 24px;
        background: #10131e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 0 18px;
      }
      .screen::before {
        content: "";
        position: absolute;
        top: 10px;
        left: 50%;
        width: 64px;
        height: 16px;
        border-radius: 99px;
        background: #05070c;
        transform: translateX(-50%);
      }
      .code {
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(135deg, var(--green), var(--teal));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .screen p {
        font: 12px var(--mono);
      }
      .eyebrow {
        display: inline-block;
        font: 13px var(--mono);
        color: var(--green);
        padding: 4px 12px;
        border: 1px solid rgba(87, 214, 135, 0.3);
        background: rgba(87, 214, 135, 0.06);
        border-radius: 99px;
      }
      h1 {
        margin: 14px 0 12px;
        font-size: clamp(30px, 5vw, 46px);
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--text);
      }
      .copy p {
        max-width: 420px;
        line-height: 1.6;
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 26px;
      }
      .btn {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        color: #0b0e16;
        background: linear-gradient(135deg, var(--green), var(--teal));
        box-shadow: 0 10px 30px -12px rgba(87, 214, 135, 0.7);
        transition: transform 0.2s;
      }
      .btn.ghost {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line-strong);
        box-shadow: none;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      :focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 3px;
      }
      @keyframes float {
        50% {
          transform: perspective(1200px) rotateY(-12deg) rotateX(4deg) translateY(-10px);
        }
      }
      @media (max-width: 640px) {
        main {
          flex-direction: column;
          gap: 36px;
          text-align: center;
        }
        .phone {
          width: 160px;
          height: 328px;
        }
        .copy p {
          margin: 0 auto;
        }
        .btns {
          justify-content: center;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .phone {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="phone" aria-hidden="true">
        <div class="screen">
          <div class="code">404</div>
          <p>Screen not found</p>
        </div>
      </div>
      <div class="copy">
        <span class="eyebrow">// route not registered</span>
        <h1>This screen isn't in the app.</h1>
        <p>
          The page you're looking for doesn't exist or has moved. Let's get you
          back to the portfolio.
        </p>
        <div class="btns">
          <a class="btn" href="/">Back to home</a>
          <a class="btn ghost" href="/#contact">Contact me</a>
        </div>
      </div>
    </main>
  </body>
</html>
